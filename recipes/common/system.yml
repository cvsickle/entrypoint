---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules:
  - type: systemd
    system:
      enabled:
        - ublue-system-setup.service
        - chronyd.service
        - tailscaled
        - bootc-fetch-apply-updates.timer
        - log2ram.service
        - log2ram-daily.timer
    user:
      enabled:
        - podman.socket
        - podman-restart.service
        - ublue-user-setup.service
